<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AK CSP-J/S ！</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: #0a0e17;
    color: #e6edf3;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* 背景光晕 */
  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.5;
    animation: float 12s ease-in-out infinite alternate;
  }
  .glow.one { width: 420px; height: 420px; background: #1f6feb; top: -120px; left: -100px; }
  .glow.two { width: 380px; height: 380px; background: #a371f7; bottom: -140px; right: -80px; animation-delay: -6s; }
  .glow.three { width: 300px; height: 300px; background: #3fb950; bottom: 20%; left: 15%; opacity: 0.25; animation-delay: -3s; }

  @keyframes float {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(40px, 30px) scale(1.15); }
  }

  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 24px;
  }

  h1 {
    font-size: clamp(2.4rem, 9vw, 5.5rem);
    font-weight: 900;
    letter-spacing: 0.04em;
    line-height: 1.15;
    background: linear-gradient(90deg, #58a6ff, #a371f7, #3fb950, #58a6ff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 6s linear infinite;
  }

  @keyframes shine { to { background-position: 300% 0; } }

  .subtitle { margin-top: 18px; font-size: clamp(0.95rem, 2.6vw, 1.35rem); color: #8b949e; letter-spacing: 0.18em; }

  .tag {
    display: inline-block;
    margin-top: 32px;
    padding: 8px 20px;
    border: 1px solid rgba(88, 166, 255, 0.4);
    border-radius: 999px;
    font-size: 0.85rem;
    color: #58a6ff;
    letter-spacing: 0.1em;
    background: rgba(88, 166, 255, 0.08);
  }

  .cursor { display: inline-block; width: 0.06em; height: 0.95em; background: #58a6ff; margin-left: 0.08em; vertical-align: -0.12em; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* --- 新增：留言按钮和弹窗样式 --- */
  .btn-message {
    position: fixed;
    bottom: 30px;
    right: 30px;
    padding: 12px 24px;
    background: rgba(88, 166, 255, 0.15);
    border: 1px solid #58a6ff;
    color: #58a6ff;
    border-radius: 999px;
    cursor: pointer;
    font-weight: bold;
    z-index: 100;
    transition: all 0.3s;
    backdrop-filter: blur(10px);
  }
  .btn-message:hover { background: #58a6ff; color: #0a0e17; box-shadow: 0 0 15px rgba(88, 166, 255, 0.5); }

  /* 弹窗样式 */
  dialog {
    margin: auto;
    width: 90%;
    max-width: 700px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 12px;
    color: #e6edf3;
    padding: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    outline: none;
  }
  dialog::backdrop {
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(5px);
  }
  .dialog-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
  .dialog-header h2 { font-size: 1.2rem; color: #58a6ff; }
  .close-btn { background: none; border: none; color: #8b949e; font-size: 1.5rem; cursor: pointer; }
  .close-btn:hover { color: #ff7b72; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
  <div class="glow one"></div>
  <div class="glow two"></div>
  <div class="glow three"></div>

  <main class="content">
    <h1>AK CSP-J/S ！<span class="cursor"></span></h1>
    <p class="subtitle">ALL KILL · 全题满分 · 一往无前</p>
    <div class="tag">CSP-J/S · 向满分进发</div>
  </main>

  <!-- 悬浮留言按钮 -->
  <button class="btn-message" id="openDialogBtn">💬 留言板</button>

  <!-- 留言弹窗 -->
  <dialog id="messageDialog">
    <div class="dialog-header">
      <h2>留言板</h2>
      <button class="close-btn" id="closeDialogBtn">&times;</button>
    </div>
    <div class="giscus"></div> <!-- giscus 评论将挂载在这里 -->
  </dialog>

  <!-- 弹窗控制逻辑 -->
  <script>
    const dialog = document.getElementById('messageDialog');
    document.getElementById('openDialogBtn').addEventListener('click', () => dialog.showModal());
    document.getElementById('closeDialogBtn').addEventListener('click', () => dialog.close());
    
    // 点击背景关闭弹窗
    dialog.addEventListener('click', (e) => {
      const rect = dialog.getBoundingClientRect();
      const isInDialog = (rect.top <= e.clientY && e.clientY <= rect.top + rect.height &&
        rect.left <= e.clientX && e.clientX <= rect.left + rect.width);
      if (!isInDialog) dialog.close();
    });
  </script>

  <!-- giscus 评论系统脚本 (请替换为你自己的配置) -->
  <script src="https://giscus.app/client.js"
        data-repo="KBP27444/akcspjstest"
        data-repo-id="R_kgDOVW2djQ"
        data-category="General"
        data-category-id="DIC_kwDOVW2djc4DJlYR"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="preferred_color_scheme"
        data-lang="zh-CN"
        crossorigin="anonymous"
        async>
</script>
</body>
</html>
